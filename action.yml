name: 'XamlA11y accessibility audit'
description: 'Static accessibility audit for WPF XAML: controls a screen reader cannot name and things a keyboard cannot reach, found without launching the app. Fails the PR on new ones, annotates the lines.'
author: 'Cornhsu'

branding:
  icon: 'eye'
  color: 'blue'

# 形狀照三件套的 action.yml（XamlContrast 1.8.3、XamlKeys 0.3.1、XamlFit 0.12.0），輸入名稱與語意一致，
# 之後合併的 Action 才接得起來：
#   inputs 先進 env 再用、先驗再裝、CLI 輸出包在 ::stop-commands:: 裡、報告與註記先出去、最後一步才依結論擋。
#   四支可以放在同一個 job：工具各裝進 $RUNNER_TEMP 的專用資料夾、報告檔名與 artifact-name 預設值各不相同，
#   留言標記就是 artifact-name，SARIF 的 category 預設用工具名（見 Upload SARIF）。
#   ⚠ Action 與 CLI 一起改：README 教使用者兩個釘同一版。

inputs:
  root:
    description: 'Folder to scan (the one containing your XAML); default: the repository root'
    required: false
    default: '.'
  working-directory:
    description: 'Directory to run in (`root`, `config` and `baseline` are resolved relative to it)'
    required: false
    default: '.'
  version:
    description: 'Cornhsu.XamlA11y tool version, such as 0.1.0 (default: the latest). The tool is 0.x: pin it, so a new release cannot change your build without a commit'
    required: false
    default: ''
  config:
    description: 'Path to xamla11y.config.json (default: the file inside root)'
    required: false
    default: ''
  baseline:
    description: 'Path to a baseline file (ratchet mode: only findings outside it are reported; the file must be committed to the repo)'
    required: false
    default: ''
  fail-on:
    description: 'fail: fail the job on fail-level findings only (the default); warn: also on warn-level ones'
    required: false
    default: ''
  min-coverage:
    description: 'Fail the job (exit 3) when fewer than this percentage (0-100) of the elements could be judged. Omit to use the config file''s minCoverage, else 60; 0 disables'
    required: false
    default: ''
  comment:
    description: 'Post/update the audit report as a PR comment. Requires `permissions: pull-requests: write` on the job — without it the step 403s (it is continue-on-error, so the gate still works but the comment is silently lost).'
    required: false
    default: 'true'
  upload-report:
    description: 'Upload the JSON and Markdown reports as an artifact named by artifact-name (default xamla11y-report)'
    required: false
    default: 'true'
  sarif:
    description: 'Upload SARIF to GitHub code scanning (requires security-events: write, plus GitHub Advanced Security or a public repo)'
    required: false
    default: 'false'
  artifact-name:
    description: 'Name of the uploaded report artifact. It also keys the PR comment: each name keeps its own comment. Give every call its own name when the action runs more than once in a workflow run (a matrix, or two calls in one job). Letters, digits, ".", "_" and "-" only, 1-100 characters, not starting with "-" and not only dots'
    required: false
    default: 'xamla11y-report'

runs:
  using: 'composite'
  steps:
    # ⚠ 所有 input 一律經由 env 進 shell，**不要**寫成 run: 裡的 ${{ inputs.x }}。
    #    ${{ }} 是在 shell 看到腳本之前就做文字代換的：呼叫端只要把一個
    #    PR 作者控制得到的值（分支名、標題、檔名）接到 input 上，
    #    那個值就會被當成指令執行。走 env 的話它永遠只是一個字串。
    #
    # 先驗再用：壞值 → exit 2（與 CLI 的用法錯誤同一碼），在裝任何東西之前。訊息只點名 input，不印值。
    - name: Validate inputs
      shell: bash
      env:
        XA_ROOT: ${{ inputs.root }}
        XA_WORKDIR: ${{ inputs.working-directory }}
        XA_VERSION: ${{ inputs.version }}
        XA_CONFIG: ${{ inputs.config }}
        XA_BASELINE: ${{ inputs.baseline }}
        XA_FAIL_ON: ${{ inputs.fail-on }}
        XA_MIN_COVERAGE: ${{ inputs.min-coverage }}
        XA_COMMENT: ${{ inputs.comment }}
        XA_UPLOAD_REPORT: ${{ inputs.upload-report }}
        XA_SARIF: ${{ inputs.sarif }}
        XA_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        # 同一個 job 前一次呼叫留下的報告（$RUNNER_TEMP 共用）不能被這一次的註記與上傳撿去
        rm -f -- "$RUNNER_TEMP/xamla11y-report.json" "$RUNNER_TEMP/xamla11y-report.md" "$RUNNER_TEMP/xamla11y.sarif"
        bad=0
        refuse() { echo "::error title=XamlA11y action::$1"; bad=1; }
        # 帶換行的值一律拒絕：CLI／dotnet 的錯誤訊息會把它原樣印出，換行後的內容落在行首就成了
        # runner 會解析的 workflow command（::error …、::add-mask::）。這些值本來就跑不起來，提早擋不改變行為
        case "$XA_ROOT$XA_WORKDIR$XA_VERSION$XA_CONFIG$XA_BASELINE$XA_MIN_COVERAGE" in
          *$'\n'* | *$'\r'*) refuse "root, working-directory, version, config, baseline and min-coverage must not contain a line break" ;;
        esac
        # 以 - 開頭的路徑會被 CLI 當成旗標：root: --version 印版本、exit 0，什麼都沒稽核就綠燈。
        # Run audit 另外以 -- 傳 root（雙重保險），這裡先點名擋下
        case "$XA_ROOT" in -*) refuse "root must not start with '-' (write ./-name for such a directory)" ;; esac
        for pair in "config=$XA_CONFIG" "baseline=$XA_BASELINE"; do
          case "${pair#*=}" in -*) refuse "${pair%%=*} must not start with '-' (write ./-name for such a path)" ;; esac
        done
        case "$XA_FAIL_ON" in
          '' | warn | fail) ;;
          *) refuse "fail-on must be 'fail', 'warn' or empty (fail)" ;;
        esac
        # 範圍（0-100）交給 CLI 驗：超出範圍是 exit 2 並說明
        [[ "$XA_MIN_COVERAGE" =~ ^([0-9]+(\.[0-9]+)?)?$ ]] || refuse "min-coverage must be a number between 0 and 100, or empty"
        # artifact-name 會成為 artifact 名稱、code scanning 的 category 與 PR 留言標記的一部分（標記又拼進 jq 字串），
        # 只收安全的字元（比照 XamlContrast）。
        # bash 的 =~ 是整串比對，換行過不了
        if ! [[ "$XA_ARTIFACT_NAME" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || [[ "$XA_ARTIFACT_NAME" =~ ^-|^\.+$ ]]; then
          refuse "artifact-name must be 1-100 characters of A-Z, a-z, 0-9, '.', '_' or '-', not starting with '-' and not only dots"
        fi
        for pair in "comment=$XA_COMMENT" "upload-report=$XA_UPLOAD_REPORT" "sarif=$XA_SARIF"; do
          case "${pair#*=}" in
            true | false) ;;
            *) refuse "${pair%%=*} must be 'true' or 'false'" ;;
          esac
        done
        if [ "$bad" -ne 0 ]; then exit 2; fi

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '10.0.x'

    - name: Install XamlA11y
      shell: bash
      env:
        XA_VERSION: ${{ inputs.version }}
      run: |
        # 裝進 $RUNNER_TEMP 的專用資料夾，不裝成全域工具（跟三件套一樣）：
        #   - 使用者自己先 `dotnet tool install --global` 過時，全域安裝會失敗；
        #   - 同一個 job 呼叫兩次（artifact-name 說可以），第二次的全域安裝也會失敗（「已經安裝」）；
        #   - Windows runner 上 $HOME 是 Git Bash 的路徑，寫進 GITHUB_PATH 不可靠 —— RUNNER_TEMP 是 runner 自己的格式。
        dir="$RUNNER_TEMP/xamla11y-tool"
        rm -rf -- "$dir"
        if [ -n "$XA_VERSION" ]; then
          dotnet tool install --tool-path "$dir" Cornhsu.XamlA11y --version "$XA_VERSION"
        else
          # 0.x 沒有「只跟隨一個 major」的承諾可以給：不釘版本就是最新版。README 教使用者釘
          dotnet tool install --tool-path "$dir" Cornhsu.XamlA11y
        fi
        echo "$dir" >> "$GITHUB_PATH"

    # 先跑、先產報告與註記，最後一步才依結論擋（讓失敗的 PR 也看得到完整輸出）
    - name: Run audit
      id: audit
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        XA_ROOT: ${{ inputs.root }}
        XA_CONFIG: ${{ inputs.config }}
        XA_BASELINE: ${{ inputs.baseline }}
        XA_FAIL_ON: ${{ inputs.fail-on }}
        XA_MIN_COVERAGE: ${{ inputs.min-coverage }}
        XA_SARIF: ${{ inputs.sarif }}
      run: |
        set +e
        args=(--json "$RUNNER_TEMP/xamla11y-report.json")
        # Markdown 報告：PR 留言與 artifact 用（comment: false 也照產，artifact 裡看得到總覽）
        args+=(--md "$RUNNER_TEMP/xamla11y-report.md")
        [ "$XA_SARIF" = "true" ] && args+=(--sarif "$RUNNER_TEMP/xamla11y.sarif")
        [ -n "$XA_CONFIG" ]   && args+=(--config "$XA_CONFIG")
        [ -n "$XA_BASELINE" ] && args+=(--baseline "$XA_BASELINE")
        # 空白就不傳，交給 config（沒有就是內建預設）—— 旗標 > config > 預設
        [ -n "$XA_FAIL_ON" ]  && args+=(--fail-on "$XA_FAIL_ON")
        [ -n "$XA_MIN_COVERAGE" ] && args+=(--min-coverage "$XA_MIN_COVERAGE")
        # ⚠ root 放在 -- 後面：之後的字一律是位置參數，以 - 開頭也不會被當成旗標
        #    （沒有這個出口的話，一個叫 --version 的資料夾會被當成旗標：印版本、exit 0、什麼都沒稽核）
        args+=(-- "$XA_ROOT")
        # CLI 的輸出包在一次性 token 的 ::stop-commands:: 裡：被稽核的 XAML 是不可信的輸入，CLI 已經把控制字元跳脫
        # （Report.Text.Safe），這是第二道防線 —— 這段期間 runner 不解析任何 workflow command。
        # token 每次隨機（固定的 token 可以被輸出內容提前關掉）
        token=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
        echo "::stop-commands::$token"
        xamla11y audit "${args[@]}"
        code=$?
        echo "::$token::"
        echo "exit=$code" >> "$GITHUB_OUTPUT"

    # 把稽核報告貼成 PR 留言（同一則反覆更新，不洗版）。整段照 XamlContrast 的 action.yml。
    # 行內註記只標在出問題的那一行，PR 上沒有總覽 —— reviewer 看不到「有幾個元素判不出來、可解析率多少」。
    # 看不到的東西必須出現在人會看的那份報告裡。
    # continue-on-error：fork PR 的 GITHUB_TOKEN 唯讀、job 沒給 pull-requests: write 時貼留言會 403 ——
    # 那是預期的，不該讓整個 job 紅在這步（gate 仍在最後一步照常擋）。
    - name: Comment report on PR
      if: ${{ github.event_name == 'pull_request' && inputs.comment == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        XA_PR: ${{ github.event.pull_request.number }}
        XA_ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        report="$RUNNER_TEMP/xamla11y-report.md"
        out="$RUNNER_TEMP/xamla11y-comment.md"
        [ -f "$report" ] || { echo "no report to post"; exit 0; }
        # 標記以 artifact-name 區分：每個名稱各自一則留言。
        # 名稱已在 Validate inputs 限定成 [A-Za-z0-9._-]，拼進 jq 字串是安全的
        marker="<!-- $XA_ARTIFACT_NAME -->"
        # GitHub 留言上限 ~65536 字，超過就截斷並附提示（完整內容在 artifact）。
        # ⚠ 截在整行上，不是截在第 60000 個位元組：head -c 會把最後一行切在 code span 中間，收尾的反引號沒了，
        #   被切開那段裡掃描來的 [文字](網址)、@帳號 就在留言裡變成連結與提及（也可能切在 UTF-8 字的中間）。
        #   sed '$d' 丟掉最後那半行 —— 報告的每一行都自己關好 code span（--md 把換行收成空白），整行為單位就是安全的
        if [ "$(wc -c < "$report")" -gt 60000 ]; then
          { echo "$marker"; head -c 60000 "$report" | sed '$d'; printf '\n\n<sub>:warning: Report truncated because it exceeds the comment size limit -- see the %s artifact on this workflow run for the full version.</sub>\n' "$XA_ARTIFACT_NAME"; } > "$out"
        else
          { echo "$marker"; cat "$report"; } > "$out"
        fi
        pr="$XA_PR"
        # --paginate：不分頁只看得到第一頁（30 則），PR 留言一多就找不到舊留言、每次都發新的。
        # --jq 逐頁套用，所以逐筆輸出 id，再在 shell 裡取第一筆（最舊的那則）。
        # 只認 github-actions[bot] 自己的留言：任何人都能搶先貼一則以標記開頭的留言，不看作者的話會去改那則
        # （改不了就永遠貼不上，改得了就是改到別人的內容）。比照 Parity
        ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id")
        existing=${ids%%$'\n'*}
        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@"$out" >/dev/null
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -F body=@"$out" >/dev/null
        fi

    # 把 finding 直接標在 PR 的行上。等級：fail → error、warn → warning、info → notice。
    # finding 的 file 是「root 相對、正斜線」路徑（JSON 與 SARIF 都是）；前綴 working-directory + root 即為 workspace 路徑。
    # 前綴組完要把 "./"、"/./"、重複的 "/" 收乾淨，否則 GitHub 對不上檔案 —— root 是 "." 時前綴是空的。
    - name: Annotate findings
      if: ${{ always() }}
      shell: bash
      env:
        XA_ROOT: ${{ inputs.root }}
        XA_WORKDIR: ${{ inputs.working-directory }}
      run: |
        report="$RUNNER_TEMP/xamla11y-report.json"
        [ -f "$report" ] || exit 0
        prefix=$(echo "$XA_WORKDIR/$XA_ROOT" | sed 's|^|/|; s|$|/|; s|//*|/|g; s|/\./|/|g; s|/\./|/|g; s|/\./|/|g; s|^/||; s|/$||')
        if [ -n "$prefix" ]; then prefix="$prefix/"; fi
        # workflow command 的跳脫（GitHub 規格）：訊息跳脫 % \r \n，屬性值（file=…）另外跳脫 : 與 ,。
        # 不跳脫的話，檔名裡一個逗號就把 file 屬性切斷、一個換行就讓後面的內容落在行首變成另一個 workflow command
        # （訊息裡有被掃的 repo 寫的字：Text="A&#10;::error::..." 是合法的 XAML，JSON 裡保留原樣）
        jq -r --arg root "$prefix" '
          def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
          def prop: esc | gsub(":"; "%3A") | gsub(","; "%2C");
          .findings[]
          | (if .severity == "fail" then "error" elif .severity == "warn" then "warning" else "notice" end) as $level
          | "::\($level) file=\(($root + .file) | prop),line=\(if .line < 1 then 1 else .line end)::\("\(.kind): \(.message)" | esc)"
        ' "$report" | tr -d '\r' || true
        # tr：Windows 上的 jq 以 CRLF 換行；訊息裡的 \r 上面已經跳脫成 %0D，這裡只會拿掉行尾那個

    # SARIF 的路徑是 root 相對 —— 先補上前綴變成 repo 相對，code scanning 才對得上檔案
    - name: Make SARIF paths repo-relative
      if: ${{ always() && inputs.sarif == 'true' }}
      shell: bash
      env:
        XA_ROOT: ${{ inputs.root }}
        XA_WORKDIR: ${{ inputs.working-directory }}
      run: |
        f="$RUNNER_TEMP/xamla11y.sarif"
        [ -f "$f" ] || exit 0
        prefix=$(echo "$XA_WORKDIR/$XA_ROOT" | sed 's|^|/|; s|$|/|; s|//*|/|g; s|/\./|/|g; s|/\./|/|g; s|/\./|/|g; s|^/||; s|/$||')
        if [ -n "$prefix" ]; then prefix="$prefix/"; fi
        jq --arg root "$prefix" \
          '(.runs[].results[].locations[].physicalLocation.artifactLocation.uri) |= ($root + .)' \
          "$f" > "$RUNNER_TEMP/xamla11y.repo.sarif"
        mv "$RUNNER_TEMP/xamla11y.repo.sarif" "$f"
    - name: Upload SARIF
      if: ${{ always() && inputs.sarif == 'true' }}
      continue-on-error: true   # 無 Advanced Security 的私有 repo 會 403，不該紅掉整個 job
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ runner.temp }}/xamla11y.sarif
        # 同一個 job 裡四件套都上傳 SARIF 時，code scanning 以「工具名 + category」區分分析，不給也不會互蓋；
        # 同一支呼叫兩次才需要不同的 category，所以用 artifact-name（預設名稱照三件套不給）
        category: ${{ inputs.artifact-name != 'xamla11y-report' && inputs.artifact-name || '' }}

    - name: Upload report
      if: ${{ always() && inputs.upload-report == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/xamla11y-report.json
          ${{ runner.temp }}/xamla11y-report.md
        if-no-files-found: ignore

    # 報告與註記都出去了，現在才依 gate 結論決定 job 成敗
    - name: Enforce gate
      shell: bash
      env:
        XA_EXIT: ${{ steps.audit.outputs.exit }}
      run: exit "$XA_EXIT"
